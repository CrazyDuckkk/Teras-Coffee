services:
  postgres:
    image: postgres:16-alpine
    container_name: teras-coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teras}
      POSTGRES_DB: ${POSTGRES_DB:-teras_coffee}
    ports:
      - "5432:5432"
    volumes:
      - teras_coffee_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teras} -d ${POSTGRES_DB:-teras_coffee}"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:16-alpine
    container_name: teras-coffee-db-test
    environment:
      POSTGRES_USER: teras_test
      POSTGRES_PASSWORD: teras_test
      POSTGRES_DB: teras_coffee_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teras_test -d teras_coffee_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teras_coffee_db_data:
