services:
  postgres:
    image: postgres:16-alpine
    container_name: teras-coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teras}
      POSTGRES_DB: ${POSTGRES_DB:-teras_coffee}
    ports:
      - "5432:5432"
    volumes:
      - teras_coffee_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teras} -d ${POSTGRES_DB:-teras_coffee}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teras_coffee_db_data:
